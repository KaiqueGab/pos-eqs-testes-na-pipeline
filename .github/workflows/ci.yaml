name: CI - Automated Tests

#Define o evento que ira disparar o workflow
on: 
  #Dispara o workflow quando houver um push/pull_request para a branch main
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

#Definem os jobs que serao executados no workflow
jobs:
  #Define o job "build"
  build:
    #Define o ambiente onde o job sera executado
    runs-on: ubuntu-latest

    #Define os passos que serao executados no job
    steps:
      - name: Checkout code
        uses: actions/checkout@v4   #Faz o checkout do codigo do repositorio no ambiente do job

      - name: Set up Python
        uses: actions/setup-python@v5 #Configura o Python no ambiente do job
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest allure-pytest

      - name: Run tests
        run: |
          pytest calculadora/test_calculadora.py --alluredir=allure-results
        